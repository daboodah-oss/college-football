<style>

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111216; --surface:#1a1c22; --surface-2:#22252d; --ink:#eceef2; --ink-2:#c3c7d1; --muted:#9aa0ae;
  --rule:#2e313b; --grid:#262932; --accent:#aeb8c6;
  --s1:#3987e5; --s1-soft:#1a2c45; --s2:#d95926; --s2-soft:#3d2216; --s3:#199e70; --s3-soft:#123a2c;
  --s4:#c98500; --s4-soft:#3a2e10; --s5:#d55181; --s5-soft:#3d1a29; --s6:#9085e9; --s6-soft:#2a2645;
  --field:#7a808e; --good:#4cc38a;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
a{color:inherit;text-decoration-color:var(--rule);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h2{font-size:30px;text-transform:uppercase}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--muted)}
.lede{color:var(--ink-2);max-width:66ch;margin:6px 0 0}
.small{font-size:13px;color:var(--muted)}
.theme-toggle{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.theme-toggle:hover{color:var(--ink);border-color:var(--ink-2)}
.theme-toggle:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.theme-toggle svg{width:17px;height:17px}

nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);margin:0 -16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.jump a{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;text-decoration:none;color:var(--ink-2);padding:4px 10px;border-radius:3px;white-space:nowrap}
nav.jump a:hover{background:var(--surface-2);color:var(--ink)}

section{padding-top:40px;scroll-margin-top:48px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.fresh{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.fresh::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.fresh.stale::before{background:#c98500}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px}
.notices{margin:16px 0 0;background:var(--surface);border:1px solid var(--rule);border-left:4px solid #c98500;border-radius:4px;padding:12px 16px}
.notices ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2);font-size:14px}
.site-id{display:flex;align-items:center;gap:14px;min-width:0}
.site-logo{height:62px;width:62px;flex:none;border-radius:12px}
@media (max-width:820px){.site-logo{height:46px;width:46px;border-radius:9px}}
.notices{position:relative;padding-right:44px}
.notices-x{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--ink-2);font-size:20px;line-height:1;padding:6px 8px;cursor:pointer;font-family:inherit}
.notices-x:hover{color:var(--ink)}
.keychip{display:inline-block;padding:0 6px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--ink-2);background:var(--surface-2);color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cat{border:1px solid var(--rule);border-radius:12px;background:var(--surface);margin:0 0 12px}
.cat>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;font:600 13px/1.2 var(--body);color:var(--ink)}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .chev{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s}
.cat[open]>summary .chev{transform:rotate(180deg)}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 12px}
.pc{font:500 13px/1.3 var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:36px}
.pc .pu{border-bottom:3px solid;padding-bottom:1px}
.pc[aria-pressed="false"]{opacity:.4}
.nrnote{margin:0;padding:0 14px 10px;max-width:75ch}
/* pickers (search + results + removable pills) */
.picker{margin-top:16px}
.picker .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nrsearch{display:block;font:400 15px/1.3 var(--body);flex:1 1 220px;max-width:380px;padding:9px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--surface);color:var(--ink)}
.nrres{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 2px}
.nrres:empty{display:none}
.nrhit{font:500 13px/1.3 var(--body);color:var(--ink);background:var(--surface);border:1px dashed var(--rule);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.nrhit .small{margin-left:5px}
.nrhit[disabled]{opacity:.45;cursor:default}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pc.nrpick{display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 0;cursor:default}
.nrpick .pn{padding:7px 4px 7px 14px}
.nrpick .nr-x{border:0;background:none;font:inherit;cursor:pointer;padding:6px 10px;color:var(--muted);font-size:17px;line-height:1;min-width:34px;min-height:34px}
.nrpick .nr-x:hover{color:var(--ink)}
.capmsg{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);border-left:3px solid #c98500;padding:4px 10px;background:var(--surface)}
.capmsg:empty{display:none}

/* controls + charts */
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0;max-width:100%}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{font:600 13px/1 var(--body);border:0;background:transparent;color:var(--ink-2);padding:8px 11px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.controls.stack{flex-direction:column;align-items:flex-start;gap:10px;min-width:0;max-width:100%}
.seg.toggle{border:0;border-radius:999px;padding:3px;background:var(--surface-2);gap:2px;flex-wrap:nowrap}
.seg.toggle button{border:0;border-radius:999px;padding:7px 16px;font-size:13px}
.seg.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg.chips{border:0;border-radius:0;background:transparent;gap:2px 16px;overflow:visible}
.seg.chips button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 1px;background:transparent;color:var(--muted);font-weight:600}
.seg.chips button:hover{color:var(--ink)}
.seg.chips button[aria-pressed="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:820px){
  .controls.stack{align-items:stretch;width:100%}
  .seg.toggle{display:flex;width:100%}
  .seg.toggle button{flex:1}
  .seg.chips{flex-wrap:wrap;gap:2px 18px}
  .seg.chips button{white-space:nowrap;padding:8px 1px}
}
.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font:12px var(--body)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--rule);stroke-width:1}
.chart .lbl{font:600 12px var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:4px;padding:8px 10px;font-size:13px;min-width:150px;z-index:3}

.lsw{display:inline-block;vertical-align:middle;flex:none}
.un{border-bottom:3px solid;padding-bottom:1px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th,table.cmp td{padding:8px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;vertical-align:middle}
table.cmp th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;color:var(--muted);font-weight:600}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.cmp td.who{font-weight:600}

table.cmp td.v span{display:inline-block;padding:1px 6px;border-radius:4px;font-family:var(--display);font-size:20px;font-weight:600}

details.logd .tscroll{padding:0 14px 14px}
.swipe{display:none}
@media (max-width:820px){ .swipe{display:inline} }
.empty{padding:20px 4px}
@media (max-width:420px){ table.cmp td.v span{font-size:17px;padding:1px 4px} table.cmp th,table.cmp td{padding:7px 5px} }
@media (prefers-reduced-motion:no-preference){ .seg button{transition:background .15s} }
</style>

const lead = (vals, dp, hb) => {  // indices of the leaders; none when every compared entry ties (the reports' rule)
  const r = vals.map(v => v==null ? null : Math.round(v*10**dp)/10**dp), comp = r.map((v,i)=>i).filter(i => r[i]!=null);
  if (comp.length < 2) return [];
  const best = (hb ? Math.max : Math.min)(...comp.map(i => r[i])), L = comp.filter(i => r[i]===best);
  return L.length===comp.length ? [] : L;
};

}

/* ---------- chart engine (the reports' lineChart, unchanged in behaviour) ---------- */
const tip = (() => { const d = document.createElement("div"); d.className="tip"; d.hidden=true; return d; })();
/* sticky tooltip: a tap/click in a chart pins the tip; it stays until a tap/click lands outside any chart */
const tipGuides = new Set();
function hideTip(){ tip.hidden = true; tipGuides.forEach(g => g.setAttribute("opacity",0)); }
document.addEventListener("pointerdown", ev => { if (!ev.target.closest || !ev.target.closest("[data-hit]")) hideTip(); });
function el(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceMax(v){ if (v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return 10*p; }
function ticks(max, n=4){ const step = max/n; return Array.from({length:n+1},(_,i)=>i*step); }
function frame(host, opts){
  host.innerHTML = ""; tip.hidden = true;
  const W = Math.max(320, host.clientWidth), H = opts.height || Math.round(Math.min(360, Math.max(240, W*0.42)));
  const pad = {l:opts.padL||46, r:opts.padR||16, t:14, b:26};
  const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":opts.aria}, host);
  return {svg, W, H, pad, iw:W-pad.l-pad.r, ih:H-pad.t-pad.b};
}
function yAxis(f, ymax, fmtY, ymin=0){
  const ts = ymin ? Array.from({length:5},(_,i)=>ymin+i*(ymax-ymin)/4) : ticks(ymax);
  const y = v => f.pad.t + f.ih - (v-ymin)/(ymax-ymin||1)*f.ih;
  ts.forEach(t => {
    el("line",{x1:f.pad.l,x2:f.W-f.pad.r,y1:y(t),y2:y(t),class:"gl"},f.svg);
    const tx = el("text",{x:f.pad.l-8,y:y(t)+4,"text-anchor":"end",class:"ax"},f.svg); tx.textContent = fmtY(t);
  });
  return y;
}
function showTip(host, x, y, html){
  if (tip.parentNode!==host) host.appendChild(tip);
  tip.innerHTML = html; tip.hidden = false;
  const hw = host.clientWidth, tw = tip.offsetWidth;
  let left = x + 14; if (left + tw > hw) left = x - tw - 14; if (left < 0) left = 0;
  tip.style.left = left+"px"; tip.style.top = Math.max(0, y - 20)+"px";
}
/* line chart: series [{name, color, width, dash, points:[{x,y,opp}], endLabel, labelColor}] */
function lineChart(host, o){
  const f = frame(host, o);
  const xs = o.xMax, x = n => f.pad.l + (n-1)/(Math.max(1,xs-1))*f.iw;
  const ymax = o.yMax ?? niceMax(Math.max(...o.series.flatMap(s=>s.points.map(p=>p.y))) * 1.02);
  const ymin = o.yMin ?? 0;
  const y = yAxis(f, ymax, o.fmtY || (v=>fmt(v)), ymin);
  el("line",{x1:f.pad.l,x2:f.W-f.pad.r,y1:f.pad.t+f.ih,y2:f.pad.t+f.ih,class:"base"},f.svg);
  const step = xs>12 ? 2 : 1;
  for (let n=1;n<=xs;n++){ if ((n-1)%step) continue; const t = el("text",{x:x(n),y:f.H-12,"text-anchor":"middle",class:"ax"},f.svg); t.textContent = n; }
  const order = [...o.series].sort((a,b)=>(a.z||0)-(b.z||0)), labels = [];
  order.forEach(s => {
    const col = s.color;
    let seg = [];
    const flush = () => { if (seg.length>1) el("path",{d:seg.map((p,i)=>(i?"L":"M")+x(p.x)+" "+y(p.y)).join(""),fill:"none",stroke:col,"stroke-width":s.width||2,"stroke-linejoin":"round","stroke-linecap":"round",opacity:s.opacity||1,"stroke-dasharray":s.dash||"none"},f.svg); seg=[]; };
    s.points.forEach(p => { if (p.y==null) flush(); else seg.push(p); }); flush();
    s.points.forEach(p => { if (p.y==null) return; el("circle",{cx:x(p.x),cy:y(p.y),r:s.r||(s.width>2?4.5:3.5),fill:s.hollow?css("--surface"):col,stroke:s.hollow?col:css("--surface"),"stroke-width":2,opacity:s.opacity||1},f.svg); });
    if (s.endLabel){ const last = [...s.points].reverse().find(p=>p.y!=null); if (last) labels.push({x:x(last.x)+8, y:y(last.y)+4, s}); }
  });
  // push apart any end labels that would overlap, including labels at different game numbers
  labels.sort((a,b)=>a.y-b.y);
  const placed = [];
  labels.forEach(l => { for (const q of placed) if (Math.abs(q.x-l.x) < 110 && l.y-q.y < 14) l.y = q.y+14; placed.push(l); });
  const bottom = f.pad.t+f.ih+4, over = placed.length ? Math.max(...placed.map(l=>l.y))-bottom : 0;
  if (over>0) placed.forEach(l=>l.y-=over);
  labels.forEach(l => { const t = el("text",{x:l.x,y:l.y,class:"lbl",fill:l.s.labelColor||css("--ink-2")},f.svg); t.textContent = l.s.endLabel; if (l.s.width>2) t.setAttribute("font-weight","700"); });
  const hit = el("rect",{x:f.pad.l-10,y:f.pad.t,width:f.iw+20,height:f.ih,fill:"transparent"},f.svg);
  const guide = el("line",{y1:f.pad.t,y2:f.pad.t+f.ih,stroke:css("--muted"),"stroke-width":1,opacity:0},f.svg);
  const move = ev => {
    tipGuides.forEach(g => { if (g!==guide) g.setAttribute("opacity",0); });
    const r = f.svg.getBoundingClientRect(), sx = (ev.clientX - r.left)/r.width*f.W;
    const n = Math.min(xs, Math.max(1, Math.round((sx - f.pad.l)/f.iw*(xs-1))+1));
    guide.setAttribute("x1",x(n)); guide.setAttribute("x2",x(n)); guide.setAttribute("opacity",.6);
    const lines = o.series.map(s => { const p = s.points.find(q=>q.x===n); return p&&p.y!=null ? `<div class="r"><span><span class="un" style="border-bottom-color:${s.color}${s.dash?";border-bottom-style:"+(s.dash==="1.5 4"?"dotted":"dashed"):""}">${esc(s.name)}</span></span><b class="num" style="font-family:var(--body);font-size:13px">${o.fmtTip(p)}</b></div>` : ""; }).join("");
    if (!lines) { tip.hidden = true; return; }
    showTip(host, x(n)/f.W*r.width, (ev.clientY-r.top), `<b>Game ${n}</b>${lines}`);
  };
  hit.setAttribute("data-hit","1"); tipGuides.add(guide);
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
}

const tLab = e => `${e.name} ${e.season}`, tShort = e => `${e.abbr || e.name} ${yr(e.season)}`;
function teamRows(games){  // build_tabs.team_totals, game by game: per-game values plus running totals
  const c = {wins:0, losses:0, ties:0, pf:0, pa:0, total_yds:0, rush_yds:0, pass_yds:0, to_margin:0, third_conv:0, third_att:0};
  return games.map((g,i) => {
    const w = g.pf>g.pa ? 1 : 0, tom = g.to_gained - g.to_lost;
    c.wins += w; c.losses += g.pf<g.pa ? 1 : 0; c.ties += g.pf===g.pa ? 1 : 0;
    for (const k of ["pf","pa","total_yds","rush_yds","pass_yds","third_conv","third_att"]) c[k] += g[k];
    c.to_margin += tom;
    return {...g, n:i+1, wins:w, to_margin:tom, third_pct: g.third_att ? 100*g.third_conv/g.third_att : null,
      cum: {...c, third_pct: c.third_att ? 100*c.third_conv/c.third_att : null}};
  });
}
function teamTotals(rows){
  if (!rows.length) return null;
  const t = {...rows[rows.length-1].cum, games: rows.length};

}

async function addTeam(k){

function drawTeam(){
  if (curTab!=="team") return;

  const S = teamSel().filter(s => !TS.off.has(s.k)).map(s => ({...s, pts: s.rows.map(r => ({x:r.n, opp:r.opp, y: mode==="cum" ? r.cum[TS.key] : r[TS.key]}))}));

  const all = S.flatMap(s=>s.pts.map(q=>q.y)).filter(v=>v!=null);

    xMax: Math.max(2, ...S.map(s=>s.rows.length)), yMin: lo, yMax: hi, padR: 84,
    fmtY: v=>fmt(v, 0), fmtTip: q => fmt(q.y, dp) + (TS.key==="third_pct"?"%":"") + (q.opp?` <span class="small">${esc(q.opp)}</span>`:""),

    S.map(s => `${tLab(s.e)} ${fmt(s.pts[s.pts.length-1].y, dp)}${TS.key==="third_pct"?"%":""} after ${s.rows.length} games`).join(", ") + ".";
}

const PS = {pos: "qb"};
POS.forEach(pos => { PS[pos] = {sel: [], off: new Set(), key: PL[pos].chart[0].key, mode: "cum", top: new Set(), topSeason: SEASON}; PL[pos].defaults.forEach(k => PS[pos].sel.push({k, slot: freeSlot(PS[pos].sel)})); });
const pLab = p => `${p.name} ${p.season}`;

const PDP = {ypc:2, ypr:2, ypg:1, rating:1, pct:1};
function playerTotals(pos, line){  // the leaderboard line (= the stored game log's sums) and the rates built from it
  const t = {...line};
  if (pos==="qb") { t.pct = line.att ? 100*line.cmp/line.att : null; t.rating = line.att ? (8.4*line.yds+330*line.td+100*line.cmp-200*line.int)/line.att : null; }
  if (pos==="rb") t.ypc = line.att ? line.yds/line.att : null;
  if (pos==="wr") t.ypr = line.rec ? line.yds/line.rec : null;
  if (pos!=="qb") t.ypg = line.g ? line.yds/line.g : null;
  return t;
}
function playerPoints(pos, rows, key, mode){  // the reports' nrPoints: per game or running total
  const c = {att:0, cmp:0, yds:0, td:0, int:0, rec:0};
  return rows.map((r,i) => {
    for (const k in c) c[k] += r[k]||0;
    const g = i+1, n = pos==="wr" ? r.rec : r.att, cn = pos==="wr" ? c.rec : c.att, src = mode==="cum" ? c : r;
    let y;
    if (pos==="qb") y = key==="pct" ? (src.att ? 100*src.cmp/src.att : null) : key==="rating" ? (src.att ? (8.4*src.yds+330*src.td+100*src.cmp-200*src.int)/src.att : null) : src[key];
    else if (key==="ypc" || key==="ypr") y = mode==="cum" ? (cn ? c.yds/cn : null) : (n ? r.yds/n : null);
    else if (key==="ypg") y = mode==="cum" ? c.yds/g : r.yds;
    else y = src[key];
    return {x:g, opp:r.opp, y};
  });
}

  const pools = SEASONS.map(s => [s, P.pools[s]]);
  const notes = [
    `The ${pos.toUpperCase()} pool for each season is the union of the top 20 ${pools.find(([,p])=>p.status==="ok") ? esc(pools.find(([,p])=>p.status==="ok")[1].positions.join("/")) : ""} on each cfbstats.com national leaderboard this tab tracks; the first three on each board are its National Top 3.  No team is left out.`,
    "Each player's game log is read from the link on his leaderboard row, never matched by name, and is stored only if it has exactly his leaderboard games and sums exactly to his leaderboard line." + (pos==="qb" ? "  Every game's listed passer rating must also match the NCAA formula, (8.4 × yards + 330 × TD + 100 × completions − 200 × INT) ÷ attempts, within 0.15 (a published rating can round 0.1 off)." : "")
      + "  Anything else is dropped and named, never estimated; a dropped player cannot be picked.",
    "Every total in the table is the player's own season line (through his games played, the G column); the chart lines players up by their own game numbers.  Rates use totals, never an average of games.",
    ...pools.map(([s,p]) => p.status==="ok" ? `${s}: ${p.players.length} ${P.noun} through ${dateFmtY(p.data_through)}${s<SEASON?" (final, sealed)":""}.` + (p.dropped.length ? `  Dropped: ${p.dropped.join("; ")}.` : "  None dropped.") : `${s}: ${p.message}`)];
  $("#player-notes").innerHTML = notes.map(n=>`<li>${esc(n)}</li>`).join("");
  $("#player-sources").innerHTML = pools.filter(([,p]) => p.status==="ok").flatMap(([s,p]) => P.table.filter(t => p.stats[t.key]).map(t => `<li><a href="${p.stats[t.key].source_url}" target="_blank" rel="noopener">cfbstats.com: ${s} national ${esc(t.label.toLowerCase())}</a></li>`)).join("")
    + S.filter(s => s.p.url).map(s => `<li><a href="${s.p.url}" target="_blank" rel="noopener">cfbstats.com: ${esc(pLab(s.p))} game log</a></li>`).join("");
  drawPlayer();
}
async function drawPlayerAsync(){  // National Top 3 lines need that season's game logs; load them, then draw
  const pos = PS.pos, st = PS[pos], pool = PL[pos].pools[st.topSeason] || {}, b = pool.stats && pool.stats[st.key];
  if (b) { try { await Promise.all(b.top.filter((k,i) => st.top.has(i)).map(k => ensurePlayer(pos, k))); } catch (e) { $("#player-capt").textContent = `Could not load the National Top 3 (${e.message}).`; } }
  drawPlayer();
}
function drawPlayer(){
  if (curTab!=="player") return;
  const pos = PS.pos, P = PL[pos], st = PS[pos], c = P.chart.find(c=>c.key===st.key), dp = PDP[st.key] || 0;
  const S = pSel(pos).filter(s => !st.off.has(s.k)).map(s => ({...s, pts: playerPoints(pos, s.rows, st.key, st.mode)}));
  const pool = P.pools[st.topSeason] || {}, b = pool.stats && pool.stats[st.key];
  const X = b ? b.top.map((k,i) => ({k, i})).filter(({k,i}) => st.top.has(i) && PROWS[pos][k]).map(({k,i}) => { const p = PIDX[pos][k], pts = playerPoints(pos, PROWS[pos][k], st.key, st.mode), last = pts[pts.length-1];
    return {name: `${pLab(p)} (${p.team})`, color: css("--field"), width: 1.75, z: 0, dash: NRDASH[i%3], r: 2.5, points: pts,
      endLabel: `${lastName(p.name)} ${yr(p.season)} ${last && last.y!=null ? fmt(last.y, dp) : ""}`, labelColor: css("--ink-2"), nr: p}; }) : [];
  if (!st.sel.length && !X.length) { emptyChart($("#player-chart"), "No player picked yet: search above to add one."); $("#player-capt").textContent = ""; return; }
  if (!S.length && !X.length) { emptyChart($("#player-chart"), "All players are toggled off — turn one back on above to see the chart."); $("#player-capt").textContent = ""; return; }
  const all = [...S.flatMap(s=>s.pts), ...X.flatMap(s=>s.points)].map(q=>q.y).filter(v=>v!=null);
  const rate = st.key==="rating" || st.key==="pct";
  let lo = 0, hi;
  if (rate) { lo = Math.floor(Math.min(...all)/20)*20; hi = Math.ceil(Math.max(...all)/20)*20; if (hi===lo) hi = lo+20; }
  else { const m = Math.max(...all, 1); if (m <= 40) hi = Math.max(4, Math.ceil(m/4)*4); }
  lineChart($("#player-chart"), {aria:`${c.label}, ${st.mode==="cum"?"running total":"per game"}, ${S.map(s=>pLab(s.p)).join(", ")}`,
    xMax: Math.max(2, ...S.map(s=>s.pts.length), ...X.map(s=>s.points.length)), yMin: lo, yMax: hi, padR: 104,
    fmtY: v=>fmt(v, 0), fmtTip: q => fmt(q.y, dp) + (q.opp?` <span class="small">${esc(q.opp)}</span>`:""),
    series: S.map(s => ({name: pLab(s.p), color: css("--"+s.slot), width: 2.5, z: 1, dash: dashed(s.slot) ? DASH : "", hollow: dashed(s.slot), points: s.pts,
      endLabel: `${lastName(s.p.name)} ${yr(s.p.season)} ${fmt(s.pts[s.pts.length-1] && s.pts[s.pts.length-1].y, dp)}`, labelColor: css("--ink-2")})).concat(X)});
  $("#player-capt").innerHTML = esc(`${st.mode==="cum" ? (dp ? `${c.label} on season totals after each game` : `Total ${c.label.toLowerCase()} after each game`) : `${c.label} in each game`}.`)
    + (X.length ? esc(`  Gray: ${X.map(s=>pLab(s.nr)).join(", ")} (National Top 3, ${st.topSeason}).`) : "");
}

/* ================================================================ tabs */
const TABS = ["team", "player"];
let curTab = "team";
const tabOf = h => TABS.includes(h) ? h : TABS.includes(h.split("-")[0]) ? h.split("-")[0] : "team";
renderTeamShell(); updateTeam();
renderPlayerShell(); updatePlayer();
function showTab(k, user){
  curTab = tabOf(k);
  TABS.forEach(t => { $("#tab-"+t).hidden = t!==curTab; const b = $(`.tabs [data-tab="${t}"]`); b.setAttribute("aria-selected", String(t===curTab)); b.tabIndex = t===curTab ? 0 : -1; });
  if (user) { history.replaceState(null, "", "#"+curTab); window.scrollTo({top:0}); }
  drawAll();
}
function drawAll(){ if (curTab==="team") drawTeam(); else drawPlayerAsync(); }
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab, true); });
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  const i = (TABS.indexOf(curTab) + (e.key==="ArrowRight"?1:TABS.length-1)) % TABS.length; showTab(TABS[i], true); $(`.tabs [data-tab="${TABS[i]}"]`).focus(); });
addEventListener("hashchange", () => { const k = tabOf(location.hash.slice(1)); if (k!==curTab) showTab(k); });
showTab(location.hash.slice(1));
let rt; addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(drawAll, 120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { drawAll(); try { if(!localStorage.getItem(THEME_KEY)) paintThemeBtn(); }catch(e){} });
new MutationObserver(drawAll).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
// for tools/render_check.js: the page's own totals for the default selection, compared there with the build's
window.CF_CHECK = {teamTotals: k => teamTotals(teamRows(TEAMROWS[k] || [])), addTeam, removeTeam, addPlayer, removePlayer, state: () => ({TS, PS})};
})();
</script>
